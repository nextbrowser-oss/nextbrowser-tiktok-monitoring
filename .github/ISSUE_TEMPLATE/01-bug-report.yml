name: Bug report
description: Report a reproducible problem with TikTok monitoring.
title: "[Bug]: "
labels: ["needs triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TikTok monitoring. Please give enough detail for someone else to reproduce the problem.

        Do not include API keys, cookies, session data, or private messages. Report security vulnerabilities through [private security reporting](https://github.com/nextbrowser-oss/nextbrowser-tiktok-monitoring/security/advisories/new).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Comments on the account's videos
        - Watched creators and their videos
        - Comment lists refused or empty
        - Mentions, keyword matching or urgency triage
        - Engagement jumps or follower counts
        - Sign-in, captcha or rate limit
        - CLI (tiktok-monitor)
        - Integration in Nextbrowser
        - Documentation
        - Other or not sure
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run tiktok-monitor once --profile ... --verbose
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "For example: v0.1.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: signed_in
    attributes:
      label: Was the profile signed in to tiktok.com?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: false

  - type: input
    id: response
    attributes:
      label: What tiktok.com answered
      description: From the --verbose log, the failing page or request, for example "page has_data=true videos=0" or "request 200 refused=an empty answer".
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste the relevant --verbose lines, with handles and comment text removed if they are private.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find an open duplicate.
        - label: I removed credentials, cookies, and private content.
